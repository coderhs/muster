[workspace]
resolver = "2"
members = ["crates/*"]
exclude = ["app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/coderhs/muster"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
rusqlite = { version = "0.42", features = ["bundled"] }
tokio = { version = "1", default-features = false }
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
muster-proto = { path = "crates/muster-proto" }
muster-core = { path = "crates/muster-core" }
